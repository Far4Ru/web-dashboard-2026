<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Интерактивный учебный дашборд ПРОМТЕХДИЗАЙН" />
    <title>Учебный дашборд — ПРОМТЕХДИЗАЙН</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/components.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="main-content">
        <header class="topbar">
          <div class="page-heading">
            <a class="brand" href="#dashboard" aria-label="ПРОМТЕХДИЗАЙН, главная">
              <img class="brand-logo" src="https://schedule.sutd.ru/assets/logo-UvcKFF5M.svg" alt="Логотип СПбГУПТД" width="80" height="83" />
              <span><strong>ПРОМТЕХДИЗАЙН</strong><small>Санкт-Петербургский государственный университет<br>промышленных технологий и дизайна</small></span>
            </a>
          </div>
          <div class="topbar-actions">
            <button class="profile-button" id="profile-button" type="button" aria-label="Настроить профиль" aria-expanded="false" title="Настроить профиль">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></svg>
            </button>
            <button class="profile-button settings-button" id="settings-button" type="button" aria-label="Настройки" title="Настройки">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.5h4l.6 2.3 1.6.9 2.3-.6 2 3.5-1.7 1.7v1.8l1.7 1.7-2 3.5-2.3-.6-1.6.9-.6 2.3h-4l-.6-2.3-1.6-.9-2.3.6-2-3.5 1.7-1.7v-1.8L3.5 8.6l2-3.5 2.3.6 1.6-.9z"/><circle cx="12" cy="11.5" r="3"/></svg>
            </button>
          </div>
        </header>

        <div class="breadcrumbs"><span>sutd.ru</span><b>/</b> Учебный дашборд</div>
        <section class="dashboard-intro">
          <h1 id="greeting-label"></h1>
          <p class="today-date" id="today-label"></p>
        </section>

        <section id="dashboard" class="dashboard-grid" aria-label="Виджеты рабочего пространства"></section>
      </main>
    </div>

    <div class="modal-backdrop" id="settings-modal" hidden>
      <section class="modal settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <header><div><p class="eyebrow">РАБОЧЕЕ ПРОСТРАНСТВО</p><h2 id="settings-title">Настройки</h2></div><button class="icon-button" data-close-modal type="button" aria-label="Закрыть">×</button></header>
        <section class="settings-section" aria-labelledby="saved-data-title">
          <h3 id="saved-data-title">Сохранённые данные</h3>
          <p>Кэш браузера ускоряет повторное открытие расписаний. Архив в составе сайта доступен после очистки.</p>
          <div id="saved-data-list" class="settings-list" role="status"></div>
        </section>
        <section class="settings-section" aria-labelledby="widgets-title">
          <h3 id="widgets-title">Управление виджетами</h3>
          <div id="settings-widget-list" class="settings-list"></div>
          <div class="settings-add"><select id="settings-add-type" aria-label="Тип нового виджета"><option value="stats">Университет сегодня</option><option value="map">Карта занятий</option><option value="today">Пары по дням</option><option value="rooms">Аудитории по дням</option><option value="monthLoad">Загрузка месяца</option><option value="statham">Цитаты Стэтхема</option></select><button type="button" id="settings-add-widget">Добавить виджет</button></div>
        </section>
      </section>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
